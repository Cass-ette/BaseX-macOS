name: Build BaseX macOS App

on:
  workflow_dispatch:
    inputs:
      basex_version:
        description: BaseX upstream version, for example 12.2
        required: false
        default: ""
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build app bundle
        shell: bash
        env:
          INPUT_BASEX_VERSION: ${{ inputs.basex_version }}
          CREATE_DMG: "1"
        run: |
          set -euo pipefail
          basex_version="$INPUT_BASEX_VERSION"
          if [[ -z "$basex_version" ]]; then
            basex_version="$(tr -d '[:space:]' < .basex-version)"
          fi
          BASEX_VERSION="$basex_version" ./scripts/build.sh

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: basex-macos-app
          path: |
            dist/BaseX.app
            dist/*.dmg
